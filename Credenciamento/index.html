<!DOCTYPE html>
<html lang="pt-br">
<head>
  <title>
      Fit Aligner
  </title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&amp;display=swap" rel="stylesheet" />
  <style>
    *{
      padding: 0px;
      margin: 0px;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Roboto', sans-serif;
      background-color: #ccc;
    }
    
    .menu-item {
      border-bottom: 2px solid #022c22;
    }
    
    .menu-item:hover {
      border-bottom: 2px solid #fff;
      
      transition: .25s ease;
      transition-duration: 0.25s;
      transition-timing-function: ease;
      transition-delay: 0s;
    }

    .bg-principal {
      background-color: #5271FF;
    }

    .bg-secondary {
      background-color: #5CE1E6;
    }
    .text-principal {
      color: #5271FF;
    }

    .text-secondary {
      color: #5CE1E6;
    }

    input:not([type=radio]) {
      width: 100%;
      border-radius: 3px;
      padding: 0.5rem !important;
      border: 1px solid #ccc;
    }

    textarea {
      width: 100%;
      max-width: 100%;
      height: 100px;
      max-height: 200px;
      border-radius: 3px;
      padding: 0.5rem !important;
      border: 1px solid #ccc;
    }

    .field {
      margin-top: 0.75rem;
    }

    .form-radio {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }

    input[type=radio]{
      width: 30px;
      cursor: pointer;
      accent-color: #5271FF;
    }

    .container {
      width: 100%;
      max-width: 600px;
      margin: 1rem auto;
      padding: 1rem;
      border-radius: 6px;
      border: 1px solid #ccc;
      background: #fff;
    }

    h2 {
      margin-top: 1rem;
    }

    button {
      width: 100%;
      padding: 0.75rem;
      background-color: #5271FF;
      color: #fff;
      border: none;
      border-radius: 3px;
      cursor: pointer;
      margin-top: 0.75rem;
    }

    button:hover {
      background-color: #4C5CFF;
    }

    input:not([type=radio]):focus {
      outline: 0;
      box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.25);
    }

    textarea:focus {
      outline: 0;
      box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.25);
    }
  </style>
</head>
<body>
    <div class="container">
        <div class="columns">
          <div class="column is-half">
            <form action="https://api.staticforms.xyz/submit" method="post" id="staticform">
              <!-- Replace with your StaticForms accessKey -->
              <!-- cba5a16d-4a65-410b-bdd4-99b0b5af66cb -->
              <input type="hidden" name="accessKey" value="1b3b06df-705d-4b27-bafe-389918d353b0">
              <input type="hidden" name="subject" value="Credenciamento Fit Aligner">

              <h2>Credenciamento Fit Aligner</h2>
              <div class="field">
                <label class="label">Nome Completo</label>
                <div class="control">
                  <input class="input" type="text" name="$Nome Completo" placeholder="Nome Completo" >
                </div>
              </div>
              <div class="field">
                <label class="label">CPF</label>
                <div class="control">
                  <input class="input" type="text" name="$CPF" placeholder="CPF" >
                </div>
              </div>
              <div class="field">
                <label class="label">CROSP</label>
                <div class="control">
                  <input class="input" type="text" name="$CROSP" placeholder="CROSP" >
                </div>
              </div>
              <div class="field">
                <label class="label">E-mail</label>
                <div class="control">
                  <input class="input" type="text" name="$E-mail" placeholder="E-mail" >
                </div>
              </div>
              <div class="field">
                <label class="label">Telefone de Contato - Dentista Credenciado</label>
                <div class="control">
                  <input class="input" type="text" name="$Telefone de Contato - Dentista Credenciado" placeholder="Telefone de Contato - Dentista Credenciado" >
                </div>
              </div>
              <div class="field">
                <label class="label">Nome da Clínica</label>
                <div class="control">
                  <input class="input" type="text" name="$Nome da Clínica" placeholder="Nome da Clínica" >
                </div>
              </div>
              <div class="field">
                <label class="label">Telefone de Contato - Clinica</label>
                <div class="control">
                  <input class="input" type="text" name="$Telefone de Contato - Clinica" placeholder="Telefone de Contato - Clinica" >
                </div>
              </div>
              <div class="field">
                <label class="label">Endereço completo da Clínica</label>
                <div class="control">
                  <input class="input" type="text" name="$Endereço completo da Clínica" placeholder="Endereço completo da Clínica" >
                </div>
              </div>
              <div class="field">
                <label class="label">Já trabalha com alinhador?</label>
                <div class="control">
                  <div class="form-radio">
                    <input type="radio" name="$Já trabalha com alinhador?" value="Sim">
                    <label for="">Sim</label>
                  </div>
                  <div class="form-radio">
                    <input type="radio" name="$Já trabalha com alinhador?" value="Não">
                    <label for="">Não</label>
                  </div>
                </div>
              </div>
              <div class="field">
                <label class="label">Se Sim, Qual?</label>
                <div class="control">
                  <input class="input" type="text" name="$Se Sim, Qual?" placeholder="Se Sim, Qual?" >
                </div>
              </div>
              <button class="button is-primary" type="Submit">Submit</button>
            </form>
          </div>
        </div>
      </div>
      <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js" integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
      <script>
        // find elements
        $("#staticform").submit(function(event) {
            event.preventDefault();
            
            var teste = $("#staticform").serialize(); //accessKey=1b3b06df-705d-4b27-bafe-389918d353b0&subject=Test%20from%20jsfiddle&name=Daniel%20Gregorio%20Maia%20Scharp&email=daniel.scharp%40hotmail.com&message=t3
            console.log(teste)
            $.ajax({
                url: 'https://api.staticforms.xyz/submit', // url where to submit the request
                type: "POST", // type of action POST || GET
                dataType: 'json', // data type
                data: teste, // post data || get data
                success: function(result) {
                    // you can see the result from the console
                    // tab of the developer tools
                    console.log(result);
                    document.getElementById('staticform').reset();
                },
                error: function(xhr, resp, text) {
                    console.log(xhr, resp, text);
                }
            })
        });

      </script>
</body>
</html>
