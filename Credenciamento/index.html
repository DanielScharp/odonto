<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <img src="../images/LogoTransparente.png" alt="" />
      <div>
        <div>(11) 3090-6066</div>
        <div>@fitaligneroficial</div>
        <div>São Paulo - SP</div>
      </div>
    </header>
    <main>
      <form
        action="https://api.staticforms.xyz/submit"
        method="post"
        id="staticform"
      >
        <div>
          <!-- Replace with your StaticForms accessKey -->
          <!-- cba5a16d-4a65-410b-bdd4-99b0b5af66cb -->
          <input
            type="hidden"
            name="accessKey"
            value="cfa6b1a3-0569-48c1-ad7e-9e899c68a5e5"
          />
          <input
            type="hidden"
            name="subject"
            value="Credenciamento Fit Aligner"
          />

          <input
            type="text"
            name="$Nome completo"
            placeholder="Nome completo:"
          />
          <input type="text" name="$CPF" placeholder="CPF:" />
          <input type="text" name="$CROSP" placeholder="CROSP:" />
          <input type="text" name="$E-mail" placeholder="E-mail:" />
          <input
            type="text"
            name="$Telefone de Contato - Dentista Credenciado"
            placeholder="Telefone de Contato - Dentista Credenciado:"
          />
          <input
            type="text"
            name="$Nome da Clínica"
            placeholder="Nome da Clínica:"
          />
          <input
            type="text"
            name="$Telefone de Contato da Clinica"
            placeholder="Telefone de Contato da Clinica:"
          />
          <input
            type="text"
            name="$Endereço completo da Clínica"
            placeholder="Endereço completo da Clínica:"
          />
        </div>

        <div class="containerRadios">
          <h3>Já trabalha com alinhador?</h3>
          <div>
            <input
              type="radio"
              name="$Já trabalha com alinhador?"
              for=""
              value="Sim"
            />
            <label>Sim</label>
          </div>
          <div>
            <input
              type="radio"
              name="$Já trabalha com alinhador?"
              for=""
              value="Não"
            />
            <label>Não</label>
          </div>
        </div>
          <input
          type="text"
          name="$Se Sim, Qual?"
          placeholder="Se Sim, Qual?:"
          />
        <div class="btnEnviar">
          <button type="submit">ENVIAR</button>
        </div>
      </form>
    </main>
  </body>
</html>
