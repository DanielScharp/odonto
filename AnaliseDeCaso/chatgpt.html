<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulário Odontológico</title>
  <style>
    /* Estilo básico */
body {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 0;
  background-color: #f7f9fc;
  color: #333;
}

.form-container {
  max-width: 600px;
  margin: 50px auto;
  padding: 20px;
  background: #ffffff;
  border-radius: 8px;
  box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
}

.form-title {
  font-size: 24px;
  color: #2d85e6;
  text-align: center;
}

.form-subtitle {
  font-size: 16px;
  color: #555;
  text-align: center;
  margin-bottom: 20px;
}

fieldset {
  border: 2px solid #2d85e6;
  border-radius: 8px;
  margin-bottom: 20px;
  padding: 15px;
}

legend {
  font-weight: bold;
  color: #2d85e6;
  font-size: 18px;
  padding: 0 10px;
}

.form-group {
  display: flex;
  flex-direction: column;
  margin-bottom: 15px;
}

.form-group label {
  font-weight: bold;
  margin-bottom: 5px;
}

.form-group input, 
.form-group textarea {
  padding: 10px;
  border: 1px solid #ccc;
  border-radius: 4px;
  font-size: 14px;
}

.form-group input:focus, 
.form-group textarea:focus {
  border-color: #2d85e6;
  outline: none;
}

textarea {
  resize: none;
}

.form-actions {
  text-align: center;
}

.submit-button {
  background-color: #2d85e6;
  color: #ffffff;
  font-size: 16px;
  padding: 10px 20px;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  transition: background-color 0.3s ease;
}

.submit-button:hover {
  background-color: #1b5f9b;
}

  </style>
</head>
<body>
  <div class="form-container">
    <h1 class="form-title">Registre as informações do paciente.</h1>
    <p class="form-subtitle">Preencha os detalhes abaixo para documentar as necessidades e especificidades do tratamento odontológico.</p>
    <form action="/submit" method="POST">
      <!-- Informações Pessoais -->
      <fieldset>
        <legend>Informações Pessoais</legend>
        <div class="form-group">
          <label for="nome">Nome Completo</label>
          <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>
        </div>
        <div class="form-group">
          <label for="cpf">CPF</label>
          <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" required>
        </div>
        <div class="form-group">
          <label for="data-nascimento">Data de Nascimento</label>
          <input type="date" id="data-nascimento" name="data-nascimento" required>
        </div>
      </fieldset>

      <!-- Contato -->
      <fieldset>
        <legend>Contato</legend>
        <div class="form-group">
          <label for="telefone">Telefone</label>
          <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" required>
        </div>
        <div class="form-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>
        </div>
        <div class="form-group">
          <label for="endereco">Endereço</label>
          <input type="text" id="endereco" name="endereco" placeholder="Rua, Número, Bairro" required>
        </div>
      </fieldset>

      <!-- Informações do Tratamento -->
      <fieldset>
        <legend>Informações do Tratamento</legend>
        <div class="form-group">
          <label for="tratamento">Tratamento Solicitado</label>
          <textarea id="tratamento" name="tratamento" placeholder="Descreva o motivo da consulta..." rows="4" required></textarea>
        </div>
        <div class="form-group">
          <label for="data-consulta">Data Preferida para Consulta</label>
          <input type="date" id="data-consulta" name="data-consulta" required>
        </div>
      </fieldset>

      <!-- Botão de Enviar -->
      <div class="form-actions">
        <button type="submit" class="submit-button">Enviar</button>
      </div>
    </form>
  </div>
</body>
</html>
