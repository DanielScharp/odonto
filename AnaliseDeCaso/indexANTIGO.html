<!DOCTYPE html>
<html lang="pt-br">
<head>
  <title>
      Fit Aligner
  </title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&amp;display=swap" rel="stylesheet" />
  <style>
    *{
      padding: 0px;
      margin: 0px;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Roboto', sans-serif;
      background-color: #4c5bff50;
    }
    
    .menu-item {
      border-bottom: 2px solid #022c22;
    }
    
    .menu-item:hover {
      border-bottom: 2px solid #fff;
      
      transition: .25s ease;
      transition-duration: 0.25s;
      transition-timing-function: ease;
      transition-delay: 0s;
    }

    .bg-principal {
      background-color: #5271FF;
    }

    .bg-secondary {
      background-color: #5CE1E6;
    }
    .text-principal {
      color: #5271FF;
    }

    .text-secondary {
      color: #5CE1E6;
    }

    input:not([type=radio]) {
      width: 100%;
      border-radius: 3px;
      padding: 0.5rem !important;
      border: 1px solid #ccc;
    }

    textarea {
      width: 100%;
      max-width: 100%;
      height: 100px;
      max-height: 200px;
      border-radius: 3px;
      padding: 0.5rem !important;
      border: 1px solid #ccc;
    }

    .field {
      margin-top: 0.75rem;
    }

    .form-radio {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }

    input[type=radio]{
      width: 30px;
      cursor: pointer;
      accent-color: #5271FF;
    }

    .container {
      width: 100%;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 1rem;
    }

    .columns {
      width: 100%;
      height: 100%;
      max-height: 100%;
      overflow: auto;
    }

    .title {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .title h1 {
      max-width: 387px;
      margin-bottom: 1rem;
    }

    .form {
      background-color: #fff;
      padding: 1rem;
      border-radius: 6px;
    }

    h2 {
      color: #5271FF;
    }

    form h2 {
      margin-top: 1rem;
    }

    button {
      width: 100%;
      padding: 0.75rem;
      background-color: #5271FF;
      color: #fff;
      border: none;
      border-radius: 3px;
      cursor: pointer;
    }

    button:hover {
      background-color: #4C5CFF;
    }

    input:not([type=radio]):focus {
      outline: 0;
      box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.25);
    }

    textarea:focus {
      outline: 0;
      box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.25);
    }
  </style>
</head>
<body>
    <div class="container">
        <div class="columns title">
          <h1>Registre as informações do paciente.</h1>
          <p>Documente as informações do paciente para o tratamento.</p>
        </div>
        <div class="columns form">
          <div class="column is-half">
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <img src="../images/logo.jpeg" alt="" width="100px" height="100px">
              <h2>Análise de Caso</h2>
            </div>
            <form action="https://api.staticforms.xyz/submit" method="post" id="staticform">
              <!-- Replace with your StaticForms accessKey -->
              <!-- cba5a16d-4a65-410b-bdd4-99b0b5af66cb -->
              <input type="hidden" name="accessKey" value="cfa6b1a3-0569-48c1-ad7e-9e899c68a5e5">
              <input type="hidden" name="subject" value="Análise de Caso">

              <div class="field">
                <label class="label">Dentista</label>
                <div class="control">
                  <input class="input" type="text" name="$Dentista" placeholder="Dentista" >
                </div>
              </div>
              <div class="field">
                <label class="label">CROSP</label>
                <div class="control">
                  <input class="input" type="text" name="$CROSP" placeholder="CROSP" >
                </div>
              </div>
              <h2>Paciente</h2>
              <div class="field">
                <label class="label">Nome</label>
                <div class="control">
                  <input class="input" type="text" name="$Nome do Paciente" placeholder="Nome do Paciente" >
                </div>
              </div>
              <div class="field">
                <label class="label">CPF</label>
                <div class="control">
                  <input class="input" type="text" name="$CPF do Paciente" placeholder="CPF do Paciente" >
                </div>
              </div>
              <div class="field">
                <label class="label">Data de Nascimento</label>
                <div class="control">
                  <input class="input" type="date" name="$Data de Nascimento" placeholder="Data de Nascimento" >
                </div>
              </div>
              <div class="field">
                <label class="label">Celular</label>
                <div class="control">
                  <input class="input" type="text" name="$Celular do Paciente" placeholder="Celular do Paciente" >
                </div>
              </div>
              <h2>Coleta de dados clínico para o estudo do caso</h2>
              <div class="field">
                <label class="label">Queixa(s) principal (ais)</label>
                <div class="control">
                  <textarea class="textarea" type="text" name="$Queixa(s) principal (ais)" placeholder="Queixa(s) principal (ais)" ></textarea>
                </div>
              </div>
              <div class="field">
                <label class="label">O paciente aceita tratamento apenas da queixa principal mesmo que não seja possível chegar nas seis chaves de Andrews?   </label>
                <div class="control">
                  <div class="form-radio">
                    <input type="radio" name="$O paciente aceita tratamento apenas da queixa principal mesmo que não seja possível chegar nas seis chaves de Andrews?" value="Sim">
                    <label for="">Sim</label>
                  </div>
                  <div class="form-radio">
                    <input type="radio" name="$O paciente aceita tratamento apenas da queixa principal mesmo que não seja possível chegar nas seis chaves de Andrews?" value="Não">
                    <label for="">Não</label>
                  </div>
                </div>
              </div>
              <div class="field">
                <label class="label">Qual é a classificação de Angle de molares?</label>
                <div class="control">
                  <div class="form-radio">
                    <input type="radio" name="$Qual é a classificação de Angle de molares?" value="Esquerda">
                    <label for="">Esquerda</label>
                  </div>
                  <div class="form-radio">

                    <input type="radio" name="$Qual é a classificação de Angle de molares?" value="Direita">
                    <label for="">Direita</label>
                  </div>
                </div>
              </div>
              <div class="field">
                <label class="label">Qual é a classificação de Angle de caninos?</label>
                <div class="control">
                  <div class="form-radio">
                    <input type="radio" name="$Qual é a classificação de Angle de caninos?" value="Esquerda">
                    <label for="">Esquerda</label>
                  </div>
                  <div class="form-radio">
                    <input type="radio" name="$Qual é a classificação de Angle de caninos?" value="Direita">
                    <label for="">Direita</label>
                  </div>
                </div>
              </div>
              <div class="field">
                <label class="label">Tem a linha mediana desviada?</label>
                <div class="control">
                  <div class="form-radio">
                    <input type="radio" name="$Tem a linha mediana desviada?" value="Sim">
                    <label for="">Sim</label>
                  </div>
                  <div class="form-radio">
                    <input type="radio" name="$Tem a linha mediana desviada?" value="Não">
                    <label for="">Não</label>
                  </div>
                </div>
              </div>
              <div class="field">
                <label class="label">Se não é Classe I, neste tratamento é preciso colocar em chave?</label>
                <div class="control">
                  <div class="form-radio">
                    <input type="radio" name="$Se não é Classe I, neste tratamento é preciso colocar em chave?" value="Sim">
                    <label for="">Sim</label>
                  </div>
                  <div class="form-radio">
                    <input type="radio" name="$Se não é Classe I, neste tratamento é preciso colocar em chave?" value="Não">
                    <label for="">Não</label>
                  </div>
                </div>
              </div>
              <h2>
                O paciente aceita o procedimento abaixo? 
              </h2>
              <div class="field">
                <label class="label">Desgaste interproximal</label>
                <div class="control">
                  <div class="form-radio">
                    <input type="radio" name="$Desgaste interproximal" value="Sim">
                    <label for="">Sim</label>
                  </div>
                  <div class="form-radio">
                    <input type="radio" name="$Desgaste interproximal" value="Não">
                    <label for="">Não</label>
                  </div>
                </div>
              </div>
              <div class="field">
                <label class="label">Elástico de Classe II ou III</label>
                <div class="control">
                  <div class="form-radio">
                    <input type="radio" name="$Elástico de Classe II ou III" value="Sim">
                    <label for="">Sim</label>
                  </div>
                  <div class="form-radio">
                    <input type="radio" name="$Elástico de Classe II ou III" value="Não">
                    <label for="">Não</label>
                  </div>
                </div>
              </div>
              <div class="field">
                <label class="label">Aumento da arcada</label>
                <div class="control">
                  <div class="form-radio">
                    <input type="radio" name="$Aumento da arcada" value="Sim">
                    <label for="">Sim</label>
                  </div>
                  <div class="form-radio">
                    <input type="radio" name="$Aumento da arcada" value="Não">
                    <label for="">Não</label>
                  </div>
                </div>
              </div>
              <div class="field">
                <label class="label">Manutenção do desvio da linha média</label>
                <div class="control">
                  <div class="form-radio">
                    <input type="radio" name="$Manutenção do desvio da linha média" value="Sim">
                    <label for="">Sim</label>
                  </div>
                  <div class="form-radio">
                    <input type="radio" name="$Manutenção do desvio da linha média" value="Não">
                    <label for="">Não</label>
                  </div>
                </div>
              </div>
              <div class="field">
                <label class="label">Extração</label>
                <div class="control">
                  <div class="form-radio">
                    <input type="radio" name="$Extração" value="Sim">
                    <label for="">Sim</label>
                  </div>
                  <div class="form-radio">
                    <input type="radio" name="$Extração" value="Não">
                    <label for="">Não</label>
                  </div>
                </div>
              </div>
              <div class="field">
                <label class="label">Aceita usar anexos em dentes anteriores</label>
                <div class="control">
                  <div class="form-radio">
                    <input type="radio" name="$Aceita usar anexos em dentes anteriores" value="Sim">
                    <label for="">Sim</label>
                  </div>
                  <div class="form-radio">
                    <input type="radio" name="$Aceita usar anexos em dentes anteriores" value="Não">
                    <label for="">Não</label>
                  </div>
                </div>
              </div>
              <div class="field">
                <label class="label">Reduzir Sobressaliência</label>
                <div class="control">
                  <div class="form-radio">
                    <input type="radio" name="$Reduzir Sobressaliência" value="Sim">
                    <label for="">Sim</label>
                  </div>
                  <div class="form-radio">
                    <input type="radio" name="$Reduzir Sobressaliência" value="Não">
                    <label for="">Não</label>
                  </div>
                </div>
              </div>
              <div class="field">
                <label class="label">Reduzir Sobremordida</label>
                <div class="control">
                  <div class="form-radio">
                    <input type="radio" name="$Reduzir Sobremordida" value="Sim">
                    <label for="">Sim</label>
                  </div>
                  <div class="form-radio">
                    <input type="radio" name="$Reduzir Sobremordida" value="Não">
                    <label for="">Não</label>
                  </div>
                </div>
              </div>
              <div class="field">
                <label class="label">Nesse espaço, escreva qualquer observação que considere importante para o planejamento deste caso.</label>
                <div class="control">
                    <textarea type="text" class="textarea" name="$Nesse espaço, escreva qualquer observação que considere importante para o planejamento deste caso." placeholder="Nesse espaço, escreva qualquer observação que considere importante para o planejamento deste caso."></textarea>
                </div>
              </div>
              <button class="button is-primary" type="Submit">Submit</button>
            </form>
          </div>
        </div>
      </div>
      <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js" integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
      <script>
        // find elements
        $("#staticform").submit(function(event) {
            event.preventDefault();
            
            var teste = $("#staticform").serialize(); //accessKey=1b3b06df-705d-4b27-bafe-389918d353b0&subject=Test%20from%20jsfiddle&name=Daniel%20Gregorio%20Maia%20Scharp&email=daniel.scharp%40hotmail.com&message=t3

                url: 'https://api.staticforms.xyz/submit', // url where to submit the request

                    // tab of the developer tools
                    console.log(result);
                    document.getElementById('staticform').reset();
                },
                error: function(xhr, resp, text) {
                    console.log(xhr, resp, text);
                }
            })
        });

      </script>
</body>
</html>
