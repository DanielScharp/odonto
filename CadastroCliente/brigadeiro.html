<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <title>Fit Aligner</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&amp;display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        padding: 0px;
        margin: 0px;
        box-sizing: border-box;
      }

      body {
        font-family: "Roboto", sans-serif;
        background-color: #4c5bff50;
        background: linear-gradient(0deg,rgba(82,113,255,0.35) 0%, rgba(92,225,230,0.15) 80%);
        max-width: 100vw;
 
        padding: 1rem;
        border-top: #4c5bff50 40px solid;
        border-bottom: #4c5bff50 40px solid;
      }

      header {
        width: 70%;
        margin: 0 auto;
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: #5271FF;
        margin-bottom: 2rem;
      }

      .cabecalho {
        text-align: end;
      }

      .containerDados {
        width: 70%;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 1rem;
        margin-bottom: 1rem;
      }

      .containerDados::before {
        content: " ";
        width: 250px;
        height: 161px;
        background-image: url(../images/alinhador-smileguide.png);
        background-size: 100%;
        position: absolute;
        right: 10%;
        margin-top: -20px;
        filter: drop-shadow(10px 10px 10px rgba(0, 0, 0, 0.5));
      }

      input[type="text"] {
        border: none;
        padding: 0.75rem;
        border-radius: 20px;
        box-shadow: 4px 4px 5px 3px rgba(0, 0, 0, 0.048);
      }

      .containerRadios {
        display: grid;
        justify-content: center;
        gap: 0.25rem;
        margin-bottom: 1rem;

      }

      .containerRadios h3{
        color: #5271FF;
      }

      .containerRadios div{
        display: flex;
        justify-content: center;
        gap: 0.5rem;
      }

      .button {
        display: grid;
        justify-content: center;
      }

      .button button {
        background-color: #5271FF;
        color: #ffffff;
        border: none;
        padding: 0.75rem 4rem;
        border-radius: 20px;
      }

    </style>
  </head>
  <body>
    <header>
      <div>
        <img src="../images/LogoTransparente.png" alt="">
      </div>
      <div class="cabecalho">
        <div>(11) 3090-6066</div>
        <div>@fitaligneroficial</div>
        <div>São Paulo - SP</div>
      </div>
    </header>
    <form action="https://api.staticforms.xyz/submit" method="post" id="staticform">
      <input type="hidden" name="accessKey" value="cfa6b1a3-0569-48c1-ad7e-9e899c68a5e5">
      <input type="hidden" name="subject" value="Análise de Caso">

      <div class="containerDados">
        <input type="text" name="$Nome completo" placeholder="Nome completo:" />
        <input type="text" name="$CPF" placeholder="CPF:" />
        <input type="text" name="$RG" placeholder="RG:" />
        <input type="text" name="$Data de Nascimento" placeholder="Data de Nascimento:" />
        <input type="text" name="$Telefone Celular" placeholder="Telefone Celular:" />
        <input type="text" name="$E-mail" placeholder="E-mail:" />
        <input type="text" name="$Rua" placeholder="Rua/Avenida/Travessa/Praça:" />
        <input type="text" name="$Numero" placeholder="Número:" />
        <input type="text" name="$Complemento" placeholder="Complemento:" />
      </div>
      <div class="containerRadios">
        <h3>Vencimento do boleto</h3>
        <div>
          <input type="radio" />
          <label name="$Vencimento do boleto" for="" value="Dia 01">Dia 01</label>
        </div>
        <div>
          <input type="radio" />
          <label name="$Vencimento do boleto" for="" value="Dia 07">Dia 07</label>
        </div>
        <div>
          <input type="radio" />
          <label name="$Vencimento do boleto" for="" value="Dia 10">Dia 10</label>
        </div>
        <div>
          <input type="radio" />
          <label name="$Vencimento do boleto" for="" value="Dia 15">Dia 15</label>
        </div>
        <div>
          <input type="radio" />
          <label name="$Vencimento do boleto" for="" value="Dia 21">Dia 21</label>
        </div>
        <div>
          <input type="radio" />
          <label name="$Vencimento do boleto" for="" value="Dia 27">Dia 27</label>
        </div>
      </div>
      <div class="button" >
        <button type="Submit">ENVIAR</button>
      </div>
    </form>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"
      integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script>
      // find elements
      $("#staticform").submit(function (event) {
        event.preventDefault();

        var teste = $("#staticform").serialize(); //accessKey=1b3b06df-705d-4b27-bafe-389918d353b0&subject=Test%20from%20jsfiddle&name=Daniel%20Gregorio%20Maia%20Scharp&email=daniel.scharp%40hotmail.com&message=t3
        console.log(teste);
        $.ajax({
          url: "https://api.staticforms.xyz/submit", // url where to submit the request
          type: "POST", // type of action POST || GET
          dataType: "json", // data type
          data: teste, // post data || get data
          success: function (result) {
            // you can see the result from the console
            // tab of the developer tools
            console.log(result);
            document.getElementById("staticform").reset();
          },
          error: function (xhr, resp, text) {
            console.log(xhr, resp, text);
          },
        });
      });
    </script>
  </body>
</html>
